        $(function () {
          const audioUrl =

          const audio = new Audio(audioUrl);

          $(audio).attr('preload', 'auto');

          $('.audioBtn').on('click', function () {

            try {

              $.error('Audio playback failed: ' + error.message);

          });
        });
