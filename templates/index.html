<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght=0,300..0,800;1,300..0,800&family=Puvi:wght=400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Open Sans"', "sans-serif"],
              title: ['"Alibaba Sans"', '"Puvi"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .loader {
        width: 48px;
        height: 48px;
        border: 5px solid #e2e8f0;
        border-bottom-color: #059669;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }
      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      body {
        background-color: #f1f5f9;
      }
      .app-card {
        border-radius: 1.5rem;
        border: 2px solid #cbd5e1;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      }
      .panel-input {
        border-radius: 1.25rem;
        border: 2px dashed #94a3b8;
        background-color: #f8fafc;
      }
      .panel-input:hover {
        border-color: #475569;
        background-color: #f1f5f9;
      }
      .preview-box {
        border-radius: 1rem;
        border: 1px solid #cbd5e1;
      }
      .action-button {
        transition: background-color 150ms ease, transform 100ms ease;
      }
      .action-button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body class="font-sans h-screen max-h-screen overflow-hidden flex flex-col items-center justify-center p-4">

    <div class="md:max-w-[50vw] w-[50vw] min-w-[320px] h-full flex flex-col items-center justify-between py-4">
      
      <header class="mb-4 text-center w-full shrink-0">
        <div class="justify-center text-emerald-700 text-3xl font-title font-bold flex items-center tracking-tight">
          <i class="fa-solid fa-seedling mr-2"></i>Sprout
        </div>
        <p class="text-slate-600 text-sm mt-1 font-medium">Weed Plant Detection AI Engine</p>
      </header>

      <main class="app-card bg-white w-full flex-1 flex flex-col p-6 md:p-8 overflow-y-auto">
        
        <div class="flex gap-2 mb-6 bg-slate-100 p-1.5 rounded-full border border-slate-200 shrink-0">
          <button id="tabUpload" onclick="switchMode('upload')" class="flex-1 py-2.5 px-4 rounded-full font-semibold text-sm flex items-center justify-center gap-2 transition-all bg-white text-slate-800 shadow-sm border border-slate-200">
            <i class="fa-solid fa-file-image"></i> Upload File
          </button>
          <button id="tabCamera" onclick="switchMode('camera')" class="flex-1 py-2.5 px-4 rounded-full font-semibold text-sm flex items-center justify-center gap-2 transition-all text-slate-600 hover:text-slate-900">
            <i class="fa-solid fa-camera"></i> Live Camera
          </button>
        </div>
        
        <form id="uploadForm" enctype="multipart/form-data" class="flex-1 flex flex-col justify-between space-y-6">
          
          <div id="uploadContainer" class="flex flex-col items-center justify-center w-full flex-1 min-h-[200px]">
            <label class="panel-input w-full h-full min-h-[200px] flex flex-col items-center justify-center cursor-pointer transition-all relative overflow-hidden">
              <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4" id="uploadPrompt">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-400 mb-3"></i>
                <p class="mb-1 text-sm text-slate-700 font-bold">Click to upload plant image</p>
                <p class="text-xs text-slate-500">PNG, JPG or JPEG up to 10MB</p>
              </div>
              <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover preview-box" src="" alt="Preview">
              <input type="file" id="fileInput" name="file" accept="image/*" class="hidden" onchange="previewImage(event)" />
            </label>
          </div>

          <div id="cameraContainer" class="hidden flex flex-col items-center justify-center w-full flex-1 min-h-[200px] space-y-4">
            <div class="w-full h-full min-h-[160px] bg-slate-900 rounded-2xl relative overflow-hidden border border-slate-300">
              <video id="videoFeed" autoplay playsinline class="w-full h-full object-cover"></video>
              <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-800 text-slate-400 text-sm">
                <i class="fa-solid fa-video-slash text-2xl mb-2"></i> Camera is off
              </div>
            </div>
            <div class="flex w-full gap-2 shrink-0">
              <button type="button" id="startCamBtn" onclick="initCam()" class="action-button flex-1 py-2 bg-slate-700 hover:bg-slate-800 text-white font-semibold rounded-full text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-power-off"></i> Start Camera
              </button>
              <button type="button" id="captureBtn" onclick="captureFrame()" disabled class="action-button flex-1 py-2 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-full text-sm flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-circle"></i> Capture Photo
              </button>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="action-button w-full py-4 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-full shadow-md flex items-center justify-center gap-2 border border-emerald-800 shrink-0">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Submit
          </button>
        </form>

        <div id="loadingState" class="hidden flex flex-col items-center justify-center py-8 space-y-4 flex-1">
          <div class="loader"></div>
          <p class="text-slate-600 text-sm font-bold">Searching...</p>
        </div>

        <div id="resultState" class="hidden mt-4 pt-4 border-t-2 border-slate-200 space-y-4 shrink-0">
          <div class="text-xs font-bold text-slate-500 uppercase tracking-wider">Result</div>
          <div class="flex items-center justify-between p-4 bg-slate-100 rounded-2xl border border-slate-200">
            <div class="flex items-center gap-3">
              <div class="p-3 bg-emerald-700 text-white rounded-xl" id="resultIconBox">
                <i class="fa-solid fa-square-check text-xl"></i>
              </div>
              <div>
                <div class="text-xs text-slate-500 font-bold">Detected Class</div>
                <div class="text-lg font-black text-slate-800" id="predictedClass">Unknown</div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-xs text-slate-500 font-bold">Confidence Match</div>
              <div class="text-xl font-black text-emerald-700" id="confidenceValue">0.0%</div>
            </div>
          </div>
        </div>

      </main>
    </div>

    <canvas id="captureCanvas" class="hidden"></canvas>

    <script>
      let currentMode = 'upload';
      let cameraStream = null;
      let activeBlob = null;

      function switchMode(mode) {
        if (mode === currentMode) return;
        currentMode = mode;

        const tabUpload = document.getElementById('tabUpload');
        const tabCamera = document.getElementById('tabCamera');
        const uploadCont = document.getElementById('uploadContainer');
        const cameraCont = document.getElementById('cameraContainer');

        if (mode === 'upload') {
          tabUpload.className = "flex-1 py-2.5 px-4 rounded-full font-semibold text-sm flex items-center justify-center gap-2 transition-all bg-white text-slate-800 shadow-sm border border-slate-200";
          tabCamera.className = "flex-1 py-2.5 px-4 rounded-full font-semibold text-sm flex items-center justify-center gap-2 transition-all text-slate-600 hover:text-slate-900";
          uploadCont.classList.remove('hidden');
          cameraCont.classList.add('hidden');
          killCam();
        } else {
          tabCamera.className = "flex-1 py-2.5 px-4 rounded-full font-semibold text-sm flex items-center justify-center gap-2 transition-all bg-white text-slate-800 shadow-sm border border-slate-200";
          tabUpload.className = "flex-1 py-2.5 px-4 rounded-full font-semibold text-sm flex items-center justify-center gap-2 transition-all text-slate-600 hover:text-slate-900";
          cameraCont.classList.remove('hidden');
          uploadCont.classList.add('hidden');
          resetUploadData();
        }
      }

      function previewImage(event) {
        const input = event.target;
        if (input.files && input.files[0]) {
          activeBlob = input.files[0];
          const reader = new FileReader();
          reader.onload = function(e) {
            document.getElementById('uploadPrompt').classList.add('hidden');
            const img = document.getElementById('imagePreview');
            img.src = e.target.result;
            img.classList.remove('hidden');
          }
          reader.readAsDataURL(activeBlob);
        }
      }

      function resetUploadData() {
        activeBlob = null;
        document.getElementById('fileInput').value = "";
        document.getElementById('imagePreview').src = "";
        document.getElementById('imagePreview').classList.add('hidden');
        document.getElementById('uploadPrompt').classList.remove('hidden');
      }

      async function initCam() {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
          const video = document.getElementById('videoFeed');
          video.srcObject = cameraStream;
          document.getElementById('cameraPlaceholder').classList.add('hidden');
          document.getElementById('captureBtn').disabled = false;
          document.getElementById('startCamBtn').innerHTML = `<i class="fa-solid fa-arrow-rotate-right"></i> Restart Cam`;
        } catch (err) {
          alert("Camera acquisition failure: Access denied or device occupied.");
        }
      }

      function killCam() {
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
        }
        document.getElementById('videoFeed').srcObject = null;
        document.getElementById('cameraPlaceholder').classList.remove('hidden');
        document.getElementById('captureBtn').disabled = true;
        document.getElementById('startCamBtn').innerHTML = `<i class="fa-solid fa-power-off"></i> Start Camera`;
      }

      function captureFrame() {
        const video = document.getElementById('videoFeed');
        const canvas = document.getElementById('captureCanvas');
        if (!cameraStream) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          activeBlob = blob;
          switchMode('upload');
          document.getElementById('uploadPrompt').classList.add('hidden');
          const img = document.getElementById('imagePreview');
          img.src = URL.createObjectURL(blob);
          img.classList.remove('hidden');
        }, 'image/jpeg', 0.9);
      }

      document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!activeBlob) {
          alert("Please capture or upload an image file first.");
          return;
        }

        const formData = new FormData();
        formData.append('file', activeBlob, currentMode === 'camera' ? 'snapshot.jpg' : activeBlob.name);

        document.getElementById('uploadForm').classList.add('hidden');
        document.getElementById('loadingState').classList.remove('hidden');
        document.getElementById('resultState').classList.add('hidden');

        try {
          const response = await fetch('/predict', { method: 'POST', body: formData });
          const data = await response.json();

          if (data.error) {
            alert("Model Error: " + data.error);
            resetUI();
            return;
          }

          document.getElementById('predictedClass').innerText = data.class;
          document.getElementById('confidenceValue').innerText = data.confidence;
          
          const iconBox = document.getElementById('resultIconBox');
          const confText = document.getElementById('confidenceValue');
          if (data.class.toLowerCase() === 'weed') {
            iconBox.className = "p-3 bg-amber-700 text-white rounded-xl";
            confText.className = "text-xl font-black text-amber-700";
          } else {
            iconBox.className = "p-3 bg-emerald-700 text-white rounded-xl";
            confText.className = "text-xl font-black text-emerald-700";
          }

          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('uploadForm').classList.remove('hidden');
          document.getElementById('resultState').classList.remove('hidden');

        } catch (err) {
          alert("Server Connection Error.");
          resetUI();
        }
      });

      function resetUI() {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('uploadForm').classList.remove('hidden');
      }
    </script>
  </body>
</html>
