<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sprout</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="https://i.postimg.cc/8CNmNF4V/Whats-App-Image-2026-06-21-at-6-56-39-PM-2-removebg-preview.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', "sans-serif"],
              title: ['"Plus Jakarta Sans"', '"Inter"', "sans-serif"],
              brand: ['"Montserrat"', "sans-serif"],
            },
          },
        },
      };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      /* Fullscreen interactive canvas background */
      #vanta-canvas {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 0;
        pointer-events: none;
        will-change: transform;
      }

      /* Interactive Ambient Light Glow (Touch & Mouse) */
      #cursor-glow {
        pointer-events: none;
        position: fixed;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(16, 185, 129, 0) 75%);
        transform: translate3d(-50%, -50%, 0);
        z-index: 1;
        opacity: 0;
        transition: opacity 0.3s ease;
        will-change: transform, opacity;
      }

      /* Custom Conic-Gradient Matrix Loader */
      .loader {
        width: 32px;
        aspect-ratio: 1;
        --g: conic-gradient(from -90deg at 6px 6px, #10b981 90deg, #0000 0);
        background: var(--g), var(--g), var(--g);
        background-size: 50% 50%;
        animation: l16 1s infinite;
      }

      @keyframes l16 {
        0%   { background-position: 0 0, 6px 6px, 12px 12px; } 
        50%  { background-position: 0 12px, 6px 6px, 12px 0; } 
        100% { background-position: 12px 12px, 0 0; } 
      }

      /* Glassmorphic UI Card Styling with 3D Depth Support */
      .app-card {
        border-radius: 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease-out;
        will-change: transform;
      }

      .app-card:hover, .app-card:active {
        border-color: rgba(16, 185, 129, 0.35);
        box-shadow: 0 18px 45px rgba(16, 185, 129, 0.15);
      }

      /* Header Glass Styling */
      .header-glass {
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      /* Upload Panel Box */
      .panel-input {
        border-radius: 1rem;
        border: 2px dashed rgba(148, 163, 184, 0.25);
        background: rgba(30, 41, 59, 0.3);
        transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease-out;
      }

      .panel-input:hover, .panel-input:active {
        border-color: rgba(16, 185, 129, 0.7);
        background: rgba(30, 41, 59, 0.5);
      }

      /* Interactive Magnetic & Soft Buttons */
      .button-soft {
        position: relative;
        overflow: hidden;
        transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        will-change: transform;
        touch-action: manipulation;
      }

      .button-soft:active {
        transform: scale(0.96) !important;
      }

      /* Animated SVG Upload Pulse */
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .animate-float {
        animation: floatPulse 2s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#0f172a] font-sans text-slate-100 antialiased overflow-x-hidden selection:bg-emerald-500 selection:text-white">
    
    <div id="vanta-canvas"></div>
    <div id="cursor-glow"></div>

    <div
      id="pageLoader"
      class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md transition-opacity duration-300"
    >
      <div
        class="flex items-center gap-4 rounded-2xl border border-emerald-500/20 bg-slate-900/90 px-6 py-4 shadow-2xl text-center max-w-xs mx-4"
      >
        <div class="loader"></div>
        <span
          id="loading-text"
          class="text-xs font-mono text-emerald-400 font-medium transition-all duration-150 opacity-100"
        >
          Initializing Sprout...
        </span>
      </div>
    </div>

    <div
      id="appContent"
      class="relative z-10 flex flex-col min-h-screen w-full max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-8 gap-4 sm:gap-6 opacity-0 transition-opacity duration-300"
    >
      <header
        class="flex items-center justify-between header-glass py-3 px-4 sm:px-6 rounded-xl sm:rounded-2xl shadow-lg"
      >
        <div class="flex items-center gap-2.5">
          <span class="text-xl sm:text-2xl font-black tracking-tight text-white font-brand">
            Sprout
          </span>
          <img
            id="sprout-logo"
            src="https://i.postimg.cc/8CNmNF4V/Whats-App-Image-2026-06-21-at-6-56-39-PM-2-removebg-preview.png"
            class="h-6 sm:h-7 w-auto object-contain"
            alt="Sprout logo"
            title="Sprout logo"
          />
        </div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] sm:text-[11px] font-mono text-emerald-400 uppercase tracking-widest hidden xs:inline">Engine Ready</span>
          <i class="fa-solid fa-circle text-[10px] text-emerald-400 fa-pulse"></i>
        </div>
      </header>

      <main class="flex-1 grid gap-4 sm:gap-6 lg:grid-cols-2 items-stretch">
        <div class="flex flex-col gap-4 sm:gap-6">
          <div class="space-y-1 px-1">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tight text-white font-title">
              Welcome!
            </h1>
            <p class="text-xs sm:text-sm leading-relaxed text-slate-300 max-w-2xl">
              Take a snapshot or upload an image to identify weed and plant specimens.
            </p>
          </div>

          <section class="flex flex-col justify-between p-4 sm:p-5 app-card flex-1">
            <div class="w-full flex flex-col flex-1">
              <div class="flex items-center justify-between text-[10px] sm:text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-2.5">
                <span>Live Camera View</span>
                <span id="cameraStatusText" class="text-rose-400 font-bold">Inactive</span>
              </div>

              <div class="relative w-full flex-1 min-h-[220px] sm:min-h-[280px] media-box overflow-hidden rounded-xl bg-slate-950/60 border border-slate-800/60 shadow-inner flex items-center justify-center">
                <video
                  id="cameraVideo"
                  class="absolute inset-0 h-full w-full object-cover rounded-xl"
                  autoplay
                  playsinline
                  muted
                ></video>
                <div
                  id="cameraOverlay"
                  class="absolute inset-0 flex items-center justify-center bg-slate-950/80 text-slate-400 text-xs font-medium px-4 text-center"
                >
                  Camera lens inactive
                </div>
              </div>
            </div>

            <div class="mt-4 flex flex-row gap-2">
              <button
                id="startCamera"
                class="flex-1 rounded-xl bg-slate-800/60 border border-slate-700/50 px-3 py-2.5 text-xs font-semibold text-slate-200 shadow-sm transition hover:bg-slate-700/80 hover:text-white button-soft group"
              >
                <i class="fa-solid fa-video mr-1.5 text-emerald-400 group-hover:fa-beat-fade"></i>
                Open Lens
              </button>
              <button
                id="capturePhoto"
                class="flex-1 rounded-xl bg-emerald-600 px-3 py-2.5 text-xs font-semibold text-white shadow-md transition hover:bg-emerald-500 button-soft group"
              >
                <i class="fa-solid fa-camera mr-1.5 group-hover:fa-bounce"></i>
                Snapshot
              </button>
            </div>
          </section>
        </div>

        <section class="flex flex-col justify-between p-4 sm:p-5 app-card h-full">
          <div class="flex flex-col gap-4 flex-1">
            <div>
              <div id="speciesName" class="text-xl sm:text-2xl md:text-3xl font-extrabold tracking-tight text-white font-title">
                Waiting for a photo
              </div>
              <div id="pestStatus" class="text-xs font-medium text-slate-400 leading-relaxed mt-1">
                Upload a photo or take a snapshot above to identify the plant.
              </div>
            </div>

            <div class="flex-1 flex flex-col justify-center min-h-[220px] sm:min-h-[280px] relative">
              <label
                id="uploadDropzone"
                class="group relative flex flex-col items-center justify-center w-full h-full min-h-[220px] sm:min-h-[280px] panel-input cursor-pointer transition p-6 text-center"
              >
                <div class="space-y-3">
                  <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center mx-auto transition group-hover:scale-110 shadow-md">
                    <svg class="w-6 h-6 fill-current text-emerald-400 animate-float" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                    </svg>
                  </div>
                  <div>
                    <span class="block text-xs font-bold text-slate-200 group-hover:text-emerald-400 transition">
                      Click to upload an image from your computer!
                    </span>
                    <span class="block text-[10px] text-slate-400 mt-1">Just upload; and wait for Sprout's engine to interpret.</span>
                  </div>
                </div>
                <input id="plantImage" type="file" accept="image/*" class="hidden" />
              </label>

              <div
                id="previewContainer"
                class="hidden absolute inset-0 overflow-hidden rounded-xl border border-slate-800/60 bg-slate-950/80 flex items-center justify-center shadow-inner group"
              >
                <img
                  id="previewImage"
                  class="h-full w-full object-contain rounded-xl"
                  src=""
                  alt="Captured specimen preview"
                />
                <button
                  id="changePhotoBtn"
                  class="absolute top-3 right-3 rounded-lg bg-slate-900/80 border border-slate-700/60 px-2.5 py-1.5 text-[10px] font-semibold text-slate-200 backdrop-blur-md hover:bg-slate-800 transition shadow-md group/btn"
                >
                  <i class="fa-solid fa-arrows-rotate mr-1 text-emerald-400 group-hover/btn:fa-spin"></i> Swap
                </button>
              </div>
            </div>
          </div>

          <button
            id="analyzeButton"
            class="mt-4 w-full rounded-xl bg-emerald-600 px-4 py-3.5 text-xs font-bold uppercase tracking-wider text-white shadow-lg transition hover:bg-emerald-500 active:bg-emerald-700 disabled:opacity-40 button-soft group"
            aria-label="Submit image for analysis"
          >
            <i id="analyzeIcon" class="fa-solid fa-magnifying-glass mr-2 group-hover:fa-beat-fade"></i>
            <span id="analyzeBtnText">Submit</span>
          </button>
        </section>
      </main>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const isMobileOrTablet = window.innerWidth <= 1024 || 'ontouchstart' in window;

        // Initialize Vanta background and store instance reference
        let vantaEffect = null;
        try {
          vantaEffect = VANTA.NET({
            el: "#vanta-canvas",
            mouseControls: false, // Disabled mouse tracking
            touchControls: false, // Disabled touch tracking
            gyroControls: false,  // Disabled device gyro tracking
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 0.85,
            color: 0x10b981,
            backgroundColor: 0x0f172a,
            points: isMobileOrTablet ? 8.00 : 12.00,
            maxDistance: isMobileOrTablet ? 18.00 : 22.00,
            spacing: isMobileOrTablet ? 18.00 : 15.00
          });
        } catch (e) {
          console.warn("Vanta background failed to load:", e);
        }

        // Re-awaken Three.js animation when returning to tab or resizing
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && vantaEffect) {
            vantaEffect.resize();
          }
        });

        window.addEventListener("resize", () => {
          if (vantaEffect) {
            vantaEffect.resize();
          }
        });

        // Fast Rotating Loader Screen
        const loaderText = document.getElementById("loading-text");
        const pageLoader = document.getElementById("pageLoader");
        const appContent = document.getElementById("appContent");

        const phrases = [
          "Initializing Sprout...",
          "Preparing Engine...",
          "Loading Neural Network..."
        ];
        let phraseIdx = 0;

        const phraseTimer = setInterval(() => {
          phraseIdx++;
          if (phraseIdx >= phrases.length) {
            clearInterval(phraseTimer);
            return;
          }
          loaderText.style.opacity = "0";
          setTimeout(() => {
            loaderText.textContent = phrases[phraseIdx];
            loaderText.style.opacity = "1";
          }, 100);
        }, 500);

        setTimeout(() => {
          pageLoader.style.opacity = "0";
          appContent.style.opacity = "1";
          setTimeout(() => pageLoader.remove(), 300);
        }, 1200);

        // Hardware Accelerated Pointer Physics
        const cursorGlow = document.getElementById("cursor-glow");
        const magneticButtons = document.querySelectorAll(".button-soft");
        const tiltCards = document.querySelectorAll(".app-card");

        let lastPointerX = 0;
        let lastPointerY = 0;
        let isPointerActive = false;
        let animFrameId = null;

        function update3DPhysics() {
          if (!isPointerActive) return;

          cursorGlow.style.left = `${lastPointerX}px`;
          cursorGlow.style.top = `${lastPointerY}px`;
          cursorGlow.style.opacity = "1";

          magneticButtons.forEach((btn) => {
            const rect = btn.getBoundingClientRect();
            const btnX = rect.left + rect.width / 2;
            const btnY = rect.top + rect.height / 2;
            const dist = Math.hypot(lastPointerX - btnX, lastPointerY - btnY);

            if (dist < (isMobileOrTablet ? 60 : 80)) {
              const pullX = (lastPointerX - btnX) * 0.2;
              const pullY = (lastPointerY - btnY) * 0.2;
              btn.style.transform = `translate3d(${pullX}px, ${pullY}px, 0) scale(1.02)`;
            } else {
              btn.style.transform = `translate3d(0px, 0px, 0) scale(1)`;
            }
          });

          tiltCards.forEach((card) => {
            const rect = card.getBoundingClientRect();
            const cardX = rect.left + rect.width / 2;
            const cardY = rect.top + rect.height / 2;
            const dist = Math.hypot(lastPointerX - cardX, lastPointerY - cardY);

            if (dist < (isMobileOrTablet ? 300 : 450)) {
              const maxTilt = isMobileOrTablet ? 4 : 7;
              const rotateX = ((lastPointerY - cardY) / rect.height) * -maxTilt;
              const rotateY = ((lastPointerX - cardX) / rect.width) * maxTilt;
              card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            } else {
              card.style.transform = `perspective(800px) rotateX(0deg) rotateY(0deg)`;
            }
          });

          animFrameId = null;
        }

        function handlePointerMove(clientX, clientY) {
          lastPointerX = clientX;
          lastPointerY = clientY;
          isPointerActive = true;

          if (!animFrameId) {
            animFrameId = requestAnimationFrame(update3DPhysics);
          }
        }

        window.addEventListener("mousemove", (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener("touchmove", (e) => {
          if (e.touches.length > 0) {
            handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });

        const resetPhysics = () => {
          isPointerActive = false;
          cursorGlow.style.opacity = "0";
          magneticButtons.forEach((btn) => (btn.style.transform = "translate3d(0,0,0) scale(1)"));
          tiltCards.forEach((card) => (card.style.transform = "perspective(800px) rotateX(0) rotateY(0)"));
        };

        document.addEventListener("mouseleave", resetPhysics);
        window.addEventListener("touchend", () => setTimeout(resetPhysics, 1000));

        // Camera & File Processing Logic
        const startCamera = document.getElementById("startCamera");
        const capturePhoto = document.getElementById("capturePhoto");
        const cameraVideo = document.getElementById("cameraVideo");
        const cameraOverlay = document.getElementById("cameraOverlay");
        const cameraStatusText = document.getElementById("cameraStatusText");
        const plantImage = document.getElementById("plantImage");
        const analyzeButton = document.getElementById("analyzeButton");
        const analyzeIcon = document.getElementById("analyzeIcon");
        const analyzeBtnText = document.getElementById("analyzeBtnText");
        const previewImage = document.getElementById("previewImage");
        const previewContainer = document.getElementById("previewContainer");
        const uploadDropzone = document.getElementById("uploadDropzone");
        const changePhotoBtn = document.getElementById("changePhotoBtn");
        const speciesName = document.getElementById("speciesName");
        const pestStatus = document.getElementById("pestStatus");

        let stream = null;
        let imageData = null;

        async function startCameraStream() {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: "environment" },
            });
            cameraVideo.srcObject = stream;
            cameraOverlay.classList.add("hidden");
            cameraStatusText.textContent = "Live";
            cameraStatusText.className = "text-emerald-400 font-bold";
          } catch (error) {
            speciesName.textContent = "Hardware Error";
            pestStatus.textContent = "Camera access denied. Please use the file upload card below.";
          }
        }

        function setPhotoPreview(dataUrl) {
          imageData = dataUrl;
          previewImage.src = imageData;
          uploadDropzone.classList.add("hidden");
          previewContainer.classList.remove("hidden");
        }

        function clearPhotoPreview() {
          imageData = null;
          previewImage.src = "";
          plantImage.value = "";
          previewContainer.classList.add("hidden");
          uploadDropzone.classList.remove("hidden");
        }

        function captureImage() {
          if (!stream || !cameraVideo.videoWidth) {
            speciesName.textContent = "Lenses Closed";
            pestStatus.textContent = "Please click 'Open Lens' to activate camera preview first.";
            return;
          }
          const canvas = document.createElement("canvas");
          canvas.width = cameraVideo.videoWidth;
          canvas.height = cameraVideo.videoHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
          setPhotoPreview(canvas.toDataURL("image/jpeg", 0.85));
        }

        plantImage.addEventListener("change", (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            setPhotoPreview(e.target.result);
          };
          reader.readAsDataURL(file);
        });

        changePhotoBtn.addEventListener("click", () => {
          clearPhotoPreview();
        });

        analyzeButton.addEventListener("click", async () => {
          if (!imageData) {
            speciesName.textContent = "Image Missing";
            pestStatus.textContent = "Please capture or upload an image first.";
            return;
          }

          analyzeButton.disabled = true;
          analyzeIcon.className = "fa-solid fa-spinner fa-spin mr-2";
          analyzeBtnText.textContent = "Analyzing...";
          speciesName.textContent = "Evaluating...";
          pestStatus.textContent = "Running neural network classification...";

          try {
            const response = await fetch(imageData);
            const blob = await response.blob();
            const formData = new FormData();
            formData.append("file", blob, "plant.jpg");

            const activePredictionEndpoint = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost" 
              ? "/predict" 
              : "https://slinky-hatching-reversal.ngrok-free.dev/predict";

            const headers = {};
            if (activePredictionEndpoint.includes("ngrok-free.dev")) {
              headers["ngrok-skip-browser-warning"] = "69420";
            }

            const result = await fetch(activePredictionEndpoint, {
              method: "POST",
              headers: headers,
              body: formData,
            });
            const data = await result.json();

            if (data.error) {
              speciesName.textContent = "Error";
              pestStatus.textContent = data.error;
            } else if (data.class) {
              speciesName.textContent = data.class;
              const modelLabel = data.model_used || "AI Engine";
              pestStatus.textContent = `Confidence: ${data.confidence} | Engine: ${modelLabel}`;
            } else {
              speciesName.textContent = "Unknown Specimen";
              pestStatus.textContent = "Sprout could not identify this plant. Please try a clearer photo.";
            }
          } catch (error) {
            speciesName.textContent = "Connection Error";
            pestStatus.textContent = `API Request failed: ${error.message}`;
          } finally {
            analyzeButton.disabled = false;
            analyzeIcon.className = "fa-solid fa-magnifying-glass mr-2 group-hover:fa-beat-fade";
            analyzeBtnText.textContent = "Submit Specimen";
          }
        });

        startCamera.addEventListener("click", startCameraStream);
        capturePhoto.addEventListener("click", captureImage);
      });
    </script>
  </body>
</html>
