<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprout</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..0,800;1,300..0,800&family=Puvi:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Open Sans"', "sans-serif"],
              title: ['"Puvi"', '"Open Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Fullscreen interactive canvas background */
      #vanta-canvas {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 0;
        pointer-events: auto;
      }

      /* Loader Spinner */
      .loader {
        width: 48px;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 6px solid transparent;
        border-right-color: rgba(16, 185, 129, 0.8);
        position: relative;
        animation: l24 2.5s infinite linear;
      }

      .loader:before,
      .loader:after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: inherit;
        animation: inherit;
        animation-duration: 1.8s;
      }

      .loader:after {
        animation-duration: 3.2s;
      }

      @keyframes l24 {
        100% {
          transform: rotate(1turn);
        }
      }

      /* Responsive UI Card Styling with Glassmorphism for dynamic contrast */
      .app-card {
        border-radius: 1.25rem;
        border: 1px solid rgba(226, 232, 240, 0.8);
        background-color: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
      }

      .panel-input {
        border-radius: 1rem;
        border-color: rgba(148, 163, 184, 0.3);
        background-color: rgba(248, 250, 252, 0.8);
      }

      .panel-input:hover {
        border-color: rgba(16, 185, 129, 0.5);
        background-color: rgba(255, 255, 255, 0.95);
      }

      .button-soft {
        transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
      }

      .button-soft:hover {
        transform: translateY(-1px);
      }

      .button-soft:active {
        transform: translateY(0);
      }

      .model-select {
        border-radius: 0.75rem;
        border-color: rgba(148, 163, 184, 0.35);
        background-color: rgba(248, 250, 252, 0.96);
      }

      .model-select:focus {
        outline: none;
        border-color: rgba(5, 150, 105, 0.6);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      }

      /* Dynamic Height Adjustment for Mobile devices */
      @media (max-width: 640px) {
        .media-box {
          min-height: 200px;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#0f172a] font-sans text-neutral-800 antialiased overflow-x-hidden">
    
    <div id="vanta-canvas"></div>

    <div
      id="pageLoader"
      class="fixed inset-0 z-50 flex items-center justify-center bg-white/95 backdrop-blur-md transition-opacity duration-500"
    >
      <div
        class="flex flex-col items-center gap-4 rounded-3xl border border-emerald-100 bg-white p-8 shadow-2xl text-center max-w-sm mx-4"
      >
        <div class="loader"></div>
        <div class="inline-flex items-center text-sm font-mono text-emerald-600">
          <span
            id="loading-text"
            class="transition-all duration-300 ease-in-out opacity-100 transform translate-y-0"
          >
            Identifying plants...
          </span>
          <span class="inline-block w-0.5 h-4 bg-current ml-2 animate-pulse"></span>
        </div>
      </div>
    </div>

    <div
      id="appContent"
      class="relative z-10 flex flex-col min-h-screen w-full max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-10 gap-6 sm:gap-8 opacity-0 transition-opacity duration-700"
    >
      <header
        class="flex items-center justify-between border-b border-white/20 pb-4 sm:pb-6 bg-slate-900/40 backdrop-blur-md px-4 sm:px-6 rounded-2xl"
      >
        <div class="flex items-center gap-2">
          <span class="text-2xl font-bold tracking-tight text-white font-title">
            Sprout
          </span>
          <img
            id="sprout-logo"
            src="https://i.postimg.cc/8CNmNF4V/Whats-App-Image-2026-06-21-at-6-56-39-PM-2-removebg-preview.png"
            class="h-7 w-auto object-contain"
            alt="Sprout logo"
            title="Sprout logo"
          />
        </div>
        <span class="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      </header>

      <main class="flex-1 grid gap-6 lg:grid-cols-[1.2fr_0.8fr] items-stretch">
        <div class="flex flex-col gap-6">
          <div class="space-y-1.5 px-1">
            <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl font-title">
              Welcome!
            </h1>
            <p class="text-xs sm:text-sm leading-relaxed text-slate-300 max-w-2xl">
              Take or upload a photo of a weed or plant. Sprout will identify the specimen using AI classification engines.
            </p>
          </div>

          <div class="grid gap-6 sm:grid-cols-2 flex-1">
            <section class="flex flex-col justify-between p-5 sm:p-6 app-card">
              <div class="w-full flex flex-col flex-1">
                <div class="flex items-center justify-between text-[11px] font-semibold uppercase tracking-widest text-neutral-400 mb-3">
                  <span>Camera Feed</span>
                  <span id="cameraStatusText" class="text-rose-500 font-bold">Disconnected</span>
                </div>

                <div class="relative w-full flex-1 min-h-[220px] sm:min-h-[260px] media-box overflow-hidden rounded-xl bg-neutral-900 border border-neutral-200/60 shadow-inner flex items-center justify-center">
                  <video
                    id="cameraVideo"
                    class="absolute inset-0 h-full w-full object-cover rounded-xl"
                    autoplay
                    playsinline
                    muted
                  ></video>
                  <div
                    id="cameraOverlay"
                    class="absolute inset-0 flex items-center justify-center bg-neutral-900/90 text-neutral-400 text-xs font-medium px-4 text-center"
                  >
                    Camera feed inactive
                  </div>
                </div>
              </div>

              <div class="mt-5 flex flex-col gap-2.5 sm:flex-row">
                <button
                  id="startCamera"
                  class="flex-1 rounded-xl bg-white border border-neutral-200 px-4 py-2.5 text-xs font-semibold text-neutral-700 shadow-sm transition hover:bg-neutral-50 active:bg-neutral-100 button-soft"
                >
                  <i class="fa-solid fa-video mr-1.5 text-neutral-500"></i>
                  Open Lens
                </button>
                <button
                  id="capturePhoto"
                  class="flex-1 rounded-xl bg-emerald-600 px-4 py-2.5 text-xs font-semibold text-white shadow-sm transition hover:bg-emerald-700 active:bg-emerald-800 button-soft"
                >
                  <i class="fa-solid fa-camera mr-1.5"></i>
                  Snapshot
                </button>
              </div>
            </section>

            <section class="flex flex-col justify-between p-5 sm:p-6 app-card">
              <div class="w-full flex flex-col flex-1">
                <div class="text-[11px] font-semibold uppercase tracking-widest text-neutral-400 mb-3">
                  File Upload
                </div>
                <label
                  class="group relative flex flex-col items-center justify-center w-full flex-1 min-h-[220px] sm:min-h-[260px] media-box border-2 border-dashed border-neutral-300 hover:border-emerald-500 panel-input cursor-pointer transition p-4 text-center"
                >
                  <div class="space-y-2">
                    <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto transition group-hover:scale-110">
                      <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                    </div>
                    <span class="block text-xs font-semibold text-neutral-700 group-hover:text-emerald-700 transition">
                      Select file from device
                    </span>
                    <span class="block text-[10px] text-neutral-400">JPG, PNG, WEBP up to 10MB</span>
                  </div>
                  <input id="plantImage" type="file" accept="image/*" class="hidden" />
                </label>
              </div>
            </section>
          </div>
        </div>

        <section class="flex flex-col justify-between p-5 sm:p-6 app-card">
          <div class="flex flex-col gap-5">
            <div>
              <div id="speciesName" class="text-2xl sm:text-3xl font-extrabold tracking-tight text-neutral-900 font-title">
                Awaiting Specimen
              </div>
              <div id="pestStatus" class="text-xs font-medium text-neutral-500 leading-relaxed mt-2">
                Capture or upload an image to begin classification analysis.
              </div>
            </div>

            <div>
              <label for="modelSelect" class="block text-[10px] font-bold uppercase tracking-widest text-neutral-400 mb-2">
                <i class="fa-solid fa-microchip mr-1"></i> Model Architecture
              </label>
              <select
                id="modelSelect"
                name="model_choice"
                class="model-select w-full px-3.5 py-2.5 text-xs font-semibold text-neutral-700 border transition cursor-pointer"
              >
                <option value="0" selected>Pesti — PyTorch Model (.pt)</option>
                <option value="1">Plight — Keras Model (.keras)</option>
              </select>
            </div>

            <div
              id="previewContainer"
              class="hidden min-h-[200px] sm:min-h-[260px] overflow-hidden rounded-xl border border-neutral-200 bg-neutral-900 flex items-center justify-center relative shadow-inner"
            >
              <img
                id="previewImage"
                class="absolute inset-0 h-full w-full object-contain rounded-xl"
                src=""
                alt="Captured specimen preview"
              />
            </div>
          </div>

          <button
            id="analyzeButton"
            class="mt-6 w-full rounded-xl bg-emerald-600 px-4 py-3.5 text-xs font-bold uppercase tracking-wider text-white shadow-md transition hover:bg-emerald-700 active:bg-emerald-800 disabled:opacity-40 disabled:cursor-not-allowed button-soft"
            aria-label="Submit image for analysis"
          >
            <i class="fa-solid fa-magnifying-glass mr-2"></i>
            <span>Submit Specimen</span>
          </button>
        </section>
      </main>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        // Initialize Vanta.js Interactive Network Background
        try {
          VANTA.NET({
            el: "#vanta-canvas",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x10b981,
            backgroundColor: 0x0f172a,
            points: 11.00,
            maxDistance: 20.00,
            spacing: 16.00
          });
        } catch (e) {
          console.warn("Vanta background failed to load:", e);
        }

        // Element Selectors
        const startCamera = document.getElementById("startCamera");
        const capturePhoto = document.getElementById("capturePhoto");
        const cameraVideo = document.getElementById("cameraVideo");
        const cameraOverlay = document.getElementById("cameraOverlay");
        const cameraStatusText = document.getElementById("cameraStatusText");
        const plantImage = document.getElementById("plantImage");
        const analyzeButton = document.getElementById("analyzeButton");
        const previewImage = document.getElementById("previewImage");
        const previewContainer = document.getElementById("previewContainer");
        const speciesName = document.getElementById("speciesName");
        const pestStatus = document.getElementById("pestStatus");
        const pageLoader = document.getElementById("pageLoader");
        const appContent = document.getElementById("appContent");
        const modelSelect = document.getElementById("modelSelect");
        const loaderText = document.getElementById("loading-text");

        let stream = null;
        let imageData = null;

        // Phrase Cycler for Screen Loader
        const loaderPhrases = [
          "Identifying plants...",
          "Organizing database...",
          "Preparing PyTorch engine...",
          "Loading Neural Networks..."
        ];
        let phraseIndex = 0;

        const phraseInterval = setInterval(() => {
          phraseIndex++;
          if (phraseIndex >= loaderPhrases.length) {
            clearInterval(phraseInterval);
            return;
          }
          loaderText.classList.add("opacity-0", "translate-y-1");
          setTimeout(() => {
            loaderText.textContent = loaderPhrases[phraseIndex];
            loaderText.classList.remove("opacity-0", "translate-y-1");
          }, 250);
        }, 1000);

        // Camera Feed Initialization
        async function startCameraStream() {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: "environment" },
            });
            cameraVideo.srcObject = stream;
            cameraOverlay.classList.add("hidden");
            cameraStatusText.textContent = "Live Feed";
            cameraStatusText.className = "text-emerald-600 font-bold";
          } catch (error) {
            alert("Sprout cannot access hardware camera. Please use file upload instead.");
          }
        }

        function captureImage() {
          if (!stream || !cameraVideo.videoWidth) {
            alert("Please activate the camera lens before capturing.");
            return;
          }
          const canvas = document.createElement("canvas");
          canvas.width = cameraVideo.videoWidth;
          canvas.height = cameraVideo.videoHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
          imageData = canvas.toDataURL("image/jpeg", 0.9);
          previewImage.src = imageData;
          previewContainer.classList.remove("hidden");
        }

        // File Input Handler
        plantImage.addEventListener("change", (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            imageData = e.target.result;
            previewImage.src = imageData;
            previewContainer.classList.remove("hidden");
          };
          reader.readAsDataURL(file);
        });

        // Prediction Submission Handler
        analyzeButton.addEventListener("click", async () => {
          if (!imageData) {
            speciesName.textContent = "Image Missing";
            pestStatus.textContent = "Please capture or upload an image first.";
            return;
          }

          const originalContent = analyzeButton.innerHTML;
          analyzeButton.disabled = true;
          analyzeButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i><span>Analyzing...</span>';
          speciesName.textContent = "Evaluating...";
          pestStatus.textContent = "Running neural network classification...";

          try {
            const response = await fetch(imageData);
            const blob = await response.blob();
            const formData = new FormData();
            formData.append("file", blob, "plant.jpg");
            formData.append("model_choice", modelSelect.value);

            const result = await fetch("/predict", {
              method: "POST",
              body: formData,
            });
            const data = await result.json();

            if (data.error) {
              speciesName.textContent = "Error";
              pestStatus.textContent = data.error;
            } else if (data.class) {
              speciesName.textContent = data.class;
              const modelLabel = data.model_used || (modelSelect.value === "0" ? "Pesti (.pt)" : "Plight (.keras)");
              pestStatus.textContent = `Confidence: ${data.confidence} | Engine: ${modelLabel}`;
            } else {
              speciesName.textContent = "Unknown Specimen";
              pestStatus.textContent = "Sprout could not identify this plant. Please try a clearer photo.";
            }
          } catch (error) {
            speciesName.textContent = "Connection Error";
            pestStatus.textContent = `API Request failed: ${error.message}`;
          } finally {
            analyzeButton.disabled = false;
            analyzeButton.innerHTML = originalContent;
          }
        });

        startCamera.addEventListener("click", startCameraStream);
        capturePhoto.addEventListener("click", captureImage);

        // Smooth Page Reveal
        setTimeout(() => {
          pageLoader.style.opacity = "0";
          appContent.style.opacity = "1";
          setTimeout(() => pageLoader.remove(), 500);
        }, 1500);
      });
    </script>
  </body>
</html>
