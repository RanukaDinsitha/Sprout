<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..0,800;1,300..0,800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Open Sans"', "sans-serif"],
              title: ['"Comic Sans MS"', '"Comic Sans"', "cursive", "sans-serif"],
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .loader {
        width: 50px;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 8px solid transparent;
        border-right-color: rgba(255, 160, 0, 0.6);
        position: relative;
        animation: l24 1s infinite linear;
      }
      .loader:before,
      .loader:after {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: inherit;
        animation: inherit;
        animation-duration: 2s;
      }
      .loader:after {
        animation-duration: 4s;
      }
      @keyframes l24 {
        100% {
          transform: rotate(1turn);
        }
      }
      body {
        background-image: radial-gradient(circle at top left, rgba(16,185,129,0.08), transparent 36%);
      }
      .app-card {
        border-radius: 1.5rem;
        border-color: rgba(226,232,240,0.88);
        box-shadow: 0 26px 70px rgba(15,23,42,0.05);
      }
      .panel-input {
        border-radius: 1.25rem;
        border-color: rgba(148,163,184,0.25);
        background-color: rgba(248,250,252,0.96);
      }
      .panel-input:hover {
        border-color: rgba(148,163,184,0.65);
        background-color: rgba(255,255,255,0.96);
      }
      .preview-box {
        border-radius: 1.25rem;
      }
      .button-soft {
        transition: transform 160ms ease, background-color 160ms ease;
      }
      .button-soft:hover {
        transform: translateY(-1px);
      }
      .button-soft:active {
        transform: translateY(0);
      }
      .section-label {
        letter-spacing: 0.18em;
      }
      header > div {
        display: flex;
        align-items: center;
        gap: 1px;
      }
      .model-select {
        border-radius: 1rem;
        border-color: rgba(148,163,184,0.35);
        background-color: rgba(248,250,252,0.96);
      }
      .model-select:focus {
        outline: none;
        border-color: rgba(5,150,105,0.6);
        box-shadow: 0 0 0 3px rgba(16,185,129,0.12);
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-[#fbfaf7] font-sans text-neutral-800 antialiased"
  >
    <div
      id="pageLoader"
      class="fixed inset-0 z-50 flex items-center justify-center bg-white/95 backdrop-blur-sm transition-opacity duration-500"
    >
      <div
        class="relative -translate-y-5 flex flex-col items-center gap-[5px] rounded-[28px] border border-emerald-100 bg-white p-8 shadow-[0_25px_80px_rgba(16,185,129,0.16)]"
      >
        <div class="loader"></div>
        <p class="text-base font-semibold text-slate-900">
          Sprout is loading...
        </p>
      </div>
    </div>

    <div
      id="appContent"
      class="flex-1 flex flex-col w-full max-w-7xl mx-auto px-4 sm:px-6 py-8 gap-8 opacity-0 transition-opacity duration-700"
    >
      <header
        class="flex items-center justify-between border-b border-neutral-200/60 pb-6"
      >
        <div>
          <p
            class="text-xl font-bold tracking-tight text-neutral-900 font-title"
          >
            Sprout
          </p>
          <p class="text-xs text-neutral-500 font-medium mt-0.5">AI Pest-Plant Identifier</p>
        </div>
        <span class="h-2 w-2 rounded-none bg-emerald-500 animate-pulse"></span>
      </header>

      <main class="flex-1 grid gap-8 lg:grid-cols-[1.2fr_0.8fr] items-stretch">
        <div class="flex flex-col gap-6">
          <div class="space-y-2">
            <h1
              class="text-3xl font-extrabold tracking-tight text-neutral-900 sm:text-4xl font-title"
            >
              Welcome!
            </h1>
            <p class="text-sm leading-relaxed text-neutral-500 max-w-2xl">
              Take or upload a photo of a pest plant. Sprout will tell you what
              type of pest it is.
            </p>
          </div>

          <div class="grid gap-6 sm:grid-cols-2 flex-1">
            <section
              class="flex flex-col justify-between border bg-white p-6 app-card"
            >
              <div class="w-full flex flex-col flex-1">
                <div
                  class="flex items-center justify-between text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-4 tracking-widest"
                >
                  <span>Camera</span>
                  <span id="cameraStatusText" class="text-neutral-400 text-red-500"
                    >Disconnected</span
                  >
                </div>

                <div
                  class="relative w-full flex-1 min-h-[260px] overflow-hidden rounded-none bg-neutral-100 border border-neutral-200 shadow-inner flex items-center justify-center"
                >
                  <video
                    id="cameraVideo"
                    class="absolute inset-0 h-full w-full object-cover rounded-none"
                    autoplay
                    playsinline
                    muted
                  ></video>
                  <div
                    id="cameraOverlay"
                    class="absolute inset-0 flex items-center justify-center bg-neutral-50 text-neutral-400 text-xs font-medium rounded-none"
                  >
                    Camera feed inactive
                  </div>
                </div>
              </div>

              <div class="mt-6 flex flex-col gap-3 sm:flex-row">
                <button
                  id="startCamera"
                  class="flex-1 rounded-none bg-white border border-neutral-200 px-4 py-3 text-xs font-semibold text-neutral-700 shadow-sm transition hover:bg-neutral-50 active:bg-neutral-100 button-soft"
                >
                  <i class="fa-solid fa-video mr-2"></i>
                  Open Lens
                </button>
                <button
                  id="capturePhoto"
                  class="flex-1 rounded-none bg-emerald-600 px-4 py-3 text-xs font-semibold text-white shadow-sm transition hover:bg-emerald-700 active:bg-emerald-800 button-soft"
                >
                  <i class="fa-solid fa-camera mr-2"></i>
                  Snapshot
                </button>
              </div>
            </section>

            <section
              class="flex flex-col justify-between border bg-white p-6 app-card"
            >
              <div class="w-full flex flex-col flex-1">
                <div
                  class="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-4 tracking-widest section-label"
                >
                  Upload
                </div>
                <label
                  class="group relative flex flex-col items-center justify-center w-full flex-1 min-h-[260px] border-2 border-dashed border-neutral-200 hover:border-neutral-300 bg-neutral-50/40 panel-input cursor-pointer transition"
                >
                  <div class="space-y-1 text-center px-4">
                    <span class="block text-xs font-medium text-neutral-600 group-hover:text-neutral-800 transition flex items-center justify-center gap-2">
                      <i class="fa-solid fa-upload text-neutral-400"></i>
                      <span>Select file from device</span>
                    </span>
                    <span class="block text-[10px] text-neutral-400">JPG, PNG up to 10MB</span>
                  </div>
                  <input
                    id="plantImage"
                    type="file"
                    accept="image/*"
                    class="hidden"
                  />
                </label>
              </div>
            </section>
          </div>
        </div>

        <section
          class="flex flex-col justify-between border bg-white p-6 app-card"
        >
          <div class="flex flex-col gap-6">
            <div>
              <div id="speciesName" class="text-2xl font-bold tracking-tight text-neutral-900 font-title">
                Awaiting Image
              </div>
              <div id="pestStatus" class="text-xs font-medium text-neutral-500 leading-relaxed mt-2">
                After you submitted your pest plant, click Submit.
              </div>
            </div>

            <div>
              <label for="modelSelect" class="block text-[10px] font-semibold uppercase tracking-widest text-neutral-400 mb-2">
                <i class="fa-solid fa-microchip mr-1"></i> Model Architecture
              </label>
              <select
                id="modelSelect"
                name="model_choice"
                class="model-select w-full px-4 py-3 text-xs font-semibold text-neutral-700 border transition"
              >
                <option value="0" selected>Pesti — PyTorch Model (.pt)</option>
                <option value="1">Plight — Keras Model (.keras)</option>
              </select>
            </div>

            <div
              id="previewContainer"
              class="hidden min-h-[220px] sm:min-h-[300px] overflow-hidden border border-neutral-200 bg-neutral-50 flex items-center justify-center relative preview-box"
            >
              <img
                id="previewImage"
                class="absolute inset-0 h-full w-full object-cover rounded-none"
                src=""
                alt="Captured specimen preview"
              />
            </div>
          </div>

          <button
            id="analyzeButton"
            class="mt-6 w-full rounded-none bg-emerald-600 px-4 py-3.5 text-xs font-semibold text-white shadow-sm transition hover:bg-emerald-700 active:bg-emerald-800 disabled:opacity-30 disabled:cursor-not-allowed button-soft"
            aria-label="Submit image for analysis"
          >
            <i class="fa-solid fa-magnifying-glass mr-2"></i>
            <span>Submit</span>
          </button>
        </section>
      </main>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const startCamera = document.getElementById("startCamera");
        const capturePhoto = document.getElementById("capturePhoto");
        const cameraVideo = document.getElementById("cameraVideo");
        const cameraOverlay = document.getElementById("cameraOverlay");
        const cameraStatusText = document.getElementById("cameraStatusText");
        const plantImage = document.getElementById("plantImage");
        const analyzeButton = document.getElementById("analyzeButton");
        const previewImage = document.getElementById("previewImage");
        const previewContainer = document.getElementById("previewContainer");
        const speciesName = document.getElementById("speciesName");
        const pestStatus = document.getElementById("pestStatus");
        const pageLoader = document.getElementById("pageLoader");
        const appContent = document.getElementById("appContent");
        const modelSelect = document.getElementById("modelSelect");

        let stream = null;
        let imageData = null;

        async function startCameraStream() {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: "environment" },
            });
            cameraVideo.srcObject = stream;
            cameraOverlay.classList.add("hidden");
            cameraStatusText.textContent = "Live Feed";
            cameraStatusText.classList.replace(
              "text-neutral-400",
              "text-emerald-600",
            );
          } catch (error) {
            alert(
              "Can not use your camera hardware. Please try using the upload system instead.",
            );
          }
        }

        function captureImage() {
          if (!stream || !cameraVideo.videoWidth) {
            alert(
              "Please activate the camera lens system before attempting capture.",
            );
            return;
          }
          const canvas = document.createElement("canvas");
          canvas.width = cameraVideo.videoWidth;
          canvas.height = cameraVideo.videoHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
          imageData = canvas.toDataURL("image/jpeg", 0.9);
          previewImage.src = imageData;
          previewContainer.classList.remove("hidden");
        }

        plantImage.addEventListener("change", (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            imageData = e.target.result;
            previewImage.src = imageData;
            previewContainer.classList.remove("hidden");
          };
          reader.readAsDataURL(file);
        });

        analyzeButton.addEventListener("click", async () => {
          if (!imageData) {
            speciesName.textContent = "Data Missing";
            pestStatus.textContent = "Please capture or upload an image first.";
            return;
          }

          const originalLabel = analyzeButton.innerHTML;
          analyzeButton.disabled = true;
          analyzeButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin mr-2"></i><span>Analyzing...</span>';
          speciesName.textContent = "Querying model...";
          pestStatus.textContent = "Evaluating classification confidence...";

          try {
            const response = await fetch(imageData);
            const blob = await response.blob();
            const formData = new FormData();
            formData.append("file", blob, "plant.jpg");
            formData.append("model_choice", modelSelect.value);

            const result = await fetch("/predict", {
              method: "POST",
              body: formData,
            });
            const data = await result.json();

            if (data.error) {
              speciesName.textContent = "Error";
              pestStatus.textContent = data.error;
            } else if (data.class) {
              speciesName.textContent = data.class;
              const modelLabel =
                data.model_used ||
                (modelSelect.value === "0" ? "Pesti (.pt)" : "Plight (.keras)");
              pestStatus.textContent = `Confidence: ${data.confidence} | Model: ${modelLabel}`;
            } else {
              speciesName.textContent = "Unknown Plant";
              pestStatus.textContent =
                "Could not identify the plant. Try a clearer photo.";
            }
          } catch (error) {
            speciesName.textContent = "Error";
            pestStatus.textContent = `API Error: ${error.message}`;
          } finally {
            analyzeButton.disabled = false;
            analyzeButton.innerHTML = originalLabel;
          }
        });

        startCamera.addEventListener("click", startCameraStream);
        capturePhoto.addEventListener("click", captureImage);

        setTimeout(() => {
          pageLoader.style.opacity = "0";
          appContent.style.opacity = "1";
          setTimeout(() => pageLoader.remove(), 500);
        }, 1500);
      });
    </script>
  </body>
</html>
