<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght=0,300..0,800;1,300..0,800&family=Puvi:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Open Sans"', "sans-serif"],
              title: ['"Alibaba Sans"', '"Puvi"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .loader {
        width: 50px;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 8px solid transparent;
        border-right-color: rgba(255, 160, 0, 0.6);
        position: relative;
        animation: l24 1s infinite linear;
      }
      .loader:before,
      .loader:after {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: inherit;
        animation: inherit;
        animation-duration: 2s;
      }
      .loader:after {
        animation-duration: 4s;
      }
      @keyframes l24 {
        100% {
          transform: rotate(1turn);
        }
      }
      body {
        background-image: radial-gradient(circle at top left, rgba(16,185,129,0.08), transparent 36%);
      }
      .app-card {
        border-radius: 1.5rem;
        border-color: rgba(226,232,240,0.88);
        box-shadow: 0 26px 70px rgba(15,23,42,0.05);
      }
      .panel-input {
        border-radius: 1.25rem;
        border-color: rgba(148,163,184,0.25);
        background-color: rgba(248,250,252,0.96);
      }
      .panel-input:hover {
        border-color: rgba(148,163,184,0.65);
        background-color: rgba(255,255,255,0.96);
      }
      .preview-box {
        border-radius: 1.25rem;
      }
      .button-soft {
        transition: transform 160ms ease, background-color 160ms ease;
      }
      .button-soft:hover {
        transform: translateY(-1px);
      }
      .button-soft:active {
        transform: translateY(0);
      }
      .section-label {
        letter-spacing: 0.18em;
      }
      header > div {
        display: flex;
        align-items: center;
        gap: 1px;
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <header class="mb-8 text-center">
      <div class="justify-center text-emerald-600 text-3xl font-title font-bold flex items-center">
        <i class="fa-solid fa-seedling mr-2"></i>Sprout
      </div>
      <p class="text-slate-500 text-sm mt-1">Weed Plant Detection AI Engine</p>
    </header>

    <main class="app-card bg-white border border-slate-200/80 w-full max-w-xl p-8 transition-all duration-300">
      
      <form id="uploadForm" enctype="multipart/form-data" class="space-y-6">
        
        <div class="flex flex-col items-center justify-center w-full">
          <label class="panel-input border-2 border-dashed w-full h-48 flex flex-col items-center justify-center cursor-pointer transition-all relative overflow-hidden">
            <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4" id="uploadPrompt">
              <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 mb-3"></i>
              <p class="mb-2 text-sm text-slate-600 font-semibold">Click to upload plant image</p>
              <p class="text-xs text-slate-400">PNG, JPG or JPEG up to 10MB</p>
            </div>
            <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover preview-box" src="" alt="Preview">
            <input type="file" id="fileInput" name="file" accept="image/*" class="hidden" onchange="previewImage(event)" />
          </label>
        </div>

        <button type="submit" id="submitBtn" class="button-soft w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-2xl shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Analyze Plant Structure
        </button>
      </form>

      <div id="loadingState" class="hidden flex flex-col items-center justify-center py-8 space-y-4">
        <div class="loader"></div>
        <p class="text-slate-500 text-sm animate-pulse font-medium">AI is inspecting leaf geometry...</p>
      </div>

      <div id="resultState" class="hidden mt-8 pt-6 border-t border-slate-100 space-y-4">
        <div class="section-label text-xs font-bold text-slate-400 uppercase tracking-wider">Analysis Result</div>
        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
          <div class="flex items-center gap-3">
            <div class="p-3 bg-emerald-100 text-emerald-700 rounded-xl" id="resultIconBox">
              <i class="fa-solid fa-square-check text-xl"></i>
            </div>
            <div>
              <div class="text-xs text-slate-400 font-medium">Detected Classification</div>
              <div class="text-lg font-bold text-slate-800" id="predictedClass">Unknown</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-xs text-slate-400 font-medium">Confidence Match</div>
            <div class="text-xl font-black text-emerald-600" id="confidenceValue">0.0%</div>
          </div>
        </div>
      </div>

      <div id="errorState" class="hidden mt-6 p-4 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-sm"></div>

    </main>

    <script>
      function previewImage(event) {
        const input = event.target;
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function(e) {
            document.getElementById('uploadPrompt').classList.add('hidden');
            const img = document.getElementById('imagePreview');
            img.src = e.target.result;
            img.classList.remove('hidden');
          }
          reader.readAsDataURL(input.files[0]);
        }
      }

      document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) {
          alert("Please upload an image file first.");
          return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        document.getElementById('uploadForm').classList.add('hidden');
        document.getElementById('loadingState').classList.remove('hidden');
        document.getElementById('resultState').classList.add('hidden');

        try {
          const response = await fetch('/predict', { method: 'POST', body: formData });
          const data = await response.json();

          if (data.error) {
            alert("Model Error: " + data.error);
            resetUI();
            return;
          }

          document.getElementById('predictedClass').innerText = data.class;
          document.getElementById('confidenceValue').innerText = data.confidence;
          
          const iconBox = document.getElementById('resultIconBox');
          const confText = document.getElementById('confidenceValue');
          if (data.class.toLowerCase() === 'weed') {
            iconBox.className = "p-3 bg-amber-100 text-amber-700 rounded-xl";
            confText.className = "text-xl font-black text-amber-600";
          } else {
            iconBox.className = "p-3 bg-emerald-100 text-emerald-700 rounded-xl";
            confText.className = "text-xl font-black text-emerald-600";
          }

          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('uploadForm').classList.remove('hidden');
          document.getElementById('resultState').classList.remove('hidden');

        } catch (err) {
          alert("Server Connection Error.");
          resetUI();
        }
      });

      function resetUI() {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('uploadForm').classList.remove('hidden');
      }
    </script>
  </body>
</html>
